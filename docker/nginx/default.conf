server {
    listen 80;
    resolver 127.0.0.11;

    # Default catch-all
    location = / {
        return 200;
    }

    # Route ALB health checks to the API container
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Route to api
    location /api/ {
        proxy_pass http://api:8000/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;  # Enable HTTP/2 support
        proxy_http_version 1.1;  # Enable HTTP/1.1

        # Long-running endpoints (e.g., hydrofabric gpkg exports) can take
        # several minutes. Default nginx proxy timeouts are 60s.
        proxy_connect_timeout 600s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }

    # Route to dashboard
    location /dashboard/ {
        proxy_pass http://dashboard:8501/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Connection keep-alive;
        proxy_read_timeout 1000;  # Increase timeout
        proxy_send_timeout 1000;  # Increase timeout
    }

    # Additional locations below point to mkdocs
